name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if examples drift from /templates, or if the generated
      # docs/assets/library.js and GEM_INSTRUCTIONS.md weren't rebuilt.
      - run: npm run check
